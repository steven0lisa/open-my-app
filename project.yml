name: OpenMyApp
options:
  bundleIdPrefix: com.openmyapp
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_NAME: OpenMyApp
    MARKETING_VERSION: "1.2.3"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: Sources/App/Info.plist
    CODE_SIGN_ENTITLEMENTS: Sources/App/OpenMyApp.entitlements
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    COMBINE_HIDPI_IMAGES: YES

targets:
  OpenMyApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openmyapp.app
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
